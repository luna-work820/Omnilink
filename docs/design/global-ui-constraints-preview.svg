  <rect x="96" y="212" width="30" height="30" rx="7" fill="#1d1f23"/>
  <path d="M105 227h12M111 221v12" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
  <text x="138" y="233" font-size="15" font-weight="650">Omnilink</text>

  <!-- Nav: icon first, short labels -->
  <rect x="92" y="278" width="202" height="42" rx="8" fill="#eef1ff"/>
  <rect x="107" y="291" width="14" height="14" rx="3" fill="none" stroke="#315bff" stroke-width="1.5"/>
  <path d="M110 295h8M110 299h8" stroke="#315bff" stroke-width="1.2"/>
  <text x="134" y="305" font-size="14" font-weight="650" fill="#315bff">总览</text>
  <rect x="107" y="341" width="14" height="14" rx="3" fill="none" stroke="#626c74" stroke-width="1.4"/>
