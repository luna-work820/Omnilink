<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1d1f23; }
      .muted { fill: #626c74; }
      .inverse { fill: #ffffff; }
      .line { stroke: #edf0f3; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1440" height="960" fill="#fcfdfe"/>

  <text x="76" y="68" font-size="12" letter-spacing="1.2" font-weight="650" fill="#626c74">OMNILINK</text>
  <text x="76" y="126" font-size="34" font-weight="650">样式</text>
  <path d="M76 157h1288" stroke="#edf0f3"/>

  <!-- Compact sidebar frame: same canvas color throughout -->
  <rect x="76" y="190" width="1288" height="570" rx="12" fill="#fcfdfe" stroke="none"/>
