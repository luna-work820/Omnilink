  <rect x="1100" y="852" width="232" height="48" rx="24" fill="#1d1f23"/>
  <path d="M1124 876h14M1131 869v14" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
  <text x="1147" y="881" font-size="13" font-weight="650" class="inverse">主钮</text>
