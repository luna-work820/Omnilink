  <text x="134" y="355" font-size="14" class="muted">商品</text>
  <circle cx="114" cy="392" r="7" fill="none" stroke="#626c74" stroke-width="1.4"/>
  <path d="M107 392h14" stroke="#626c74" stroke-width="1.2"/>
  <text x="134" y="397" font-size="14" class="muted">内容</text>
  <path d="M107 444h14M109 440l5-5 5 5M114 439v12" fill="none" stroke="#626c74" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="134" y="449" font-size="14" class="muted">设置</text>
  <path d="M96 706h198" stroke="#f0f2f5"/>
  <circle cx="114" cy="731" r="14" fill="#e3e8ed"/>
