  <rect x="1209" y="211" width="130" height="42" rx="21" fill="#1d1f23"/>
  <path d="M1233 232h14M1240 225v14" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
  <text x="1255" y="237" font-size="13" font-weight="650" class="inverse">新建</text>

  <!-- Base card: same fill as canvas, thin outline -->
  <rect x="344" y="307" width="610" height="184" rx="12" fill="#fcfdfe" stroke="none"/>
  <rect x="360" y="323" width="184" height="152" rx="8" fill="#e3e8ed"/>
  <!-- lamp pictogram -->
  <path d="M441 434h34M458 432v-47M457 386l-31-24M425 362l27-7 12 18-32 12zM434 432l-9 16M474 432l9 16" fill="none" stroke="#4b525a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="458" cy="385" r="4" fill="#f18a24"/>
  <text x="568" y="351" font-size="12" class="muted">家居</text>
  <text x="568" y="384" font-size="20" font-weight="650">台灯</text>
  <text x="568" y="426" font-size="17" font-weight="650">¥280</text>
  <path d="M904 395h22m-9-9 9 9-9 9" fill="none" stroke="#626c74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hover card: only its background changes -->
  <rect x="974" y="307" width="365" height="184" rx="12" fill="#e9edf2" stroke="none"/>
  <rect x="991" y="324" width="150" height="150" rx="8" fill="#e3e8ed"/>
  <!-- chair pictogram -->
  <path d="M1031 360v61h62v-37h-62M1031 421l-8 32M1085 421l9 32M1093 384h17v37" fill="none" stroke="#4b525a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1160" y="353" font-size="12" class="muted">家居</text>
  <text x="1160" y="384" font-size="20" font-weight="650">椅子</text>
  <text x="1160" y="426" font-size="17" font-weight="650">¥680</text>
  <path d="M1291 394h22m-9-9 9 9-9 9" fill="none" stroke="#626c74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Selected card: only its background changes -->
  <rect x="344" y="508" width="995" height="224" rx="12" fill="#eef1ff" stroke="none"/>
  <rect x="360" y="524" width="324" height="192" rx="8" fill="#e3e8ed"/>
  <circle cx="522" cy="620" r="43" fill="#f7f9fb"/>
  <path d="M513 598v44l33-22z" fill="#315bff"/>
  <text x="710" y="555" font-size="12" class="muted">内容</text>
  <text x="710" y="592" font-size="20" font-weight="650">灵感</text>
  <text x="710" y="635" font-size="14" class="muted">3 件</text>
  <path d="M1292 610h22m-9-9 9 9-9 9" fill="none" stroke="#626c74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- State samples -->
  <text x="76" y="816" font-size="18" font-weight="650">卡片</text>
  <rect x="76" y="838" width="250" height="82" rx="12" fill="#fcfdfe" stroke="none"/>
  <text x="96" y="886" font-size="14" font-weight="600">默认</text>
  <rect x="346" y="838" width="250" height="82" rx="12" fill="#e9edf2" stroke="none"/>
